<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知测试工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 30px;
    }
    
    button {
      padding: 14px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      grid-column: span 2;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .btn-success {
      background: #4caf50;
      color: white;
    }
    
    .btn-success:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
    }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }
    
    .status.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
    }
    
    .status.info {
      background: #e3f2fd;
      color: #1565c0;
      border-left: 4px solid #2196f3;
    }
    
    .tips {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .tips h3 {
      color: #333;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .tips ul {
      margin-left: 20px;
      color: #666;
      line-height: 1.8;
    }
    
    .tips li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 通知测试工具</h1>
    <p class="subtitle">用于测试 Electron 应用的通知功能</p>
    
    <div class="form-group">
      <label for="title">通知标题</label>
      <input type="text" id="title" placeholder="例如：MQTT消息推送" value="测试通知">
    </div>
    
    <div class="form-group">
      <label for="content">通知内容</label>
      <textarea id="content" placeholder="输入通知内容...">这是一条测试通知消息，用于验证通知功能是否正常工作。</textarea>
    </div>
    
    <div class="button-group">
      <button class="btn-primary" onclick="sendTestNotification()">
        📤 发送测试通知
      </button>
      <button class="btn-success" onclick="sendMqttNotification()">
        📨 模拟 MQTT 通知
      </button>
      <button class="btn-secondary" onclick="stopFlash()">
        ⏹️ 停止闪烁
      </button>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="tips">
      <h3>💡 使用提示</h3>
      <ul>
        <li><strong>托盘图标闪烁：</strong>发送通知后，托盘图标会开始闪烁</li>
        <li><strong>鼠标悬停：</strong>将鼠标移到托盘图标上会显示通知弹窗</li>
        <li><strong>点击通知：</strong>点击系统通知会自动打开应用窗口</li>
        <li><strong>停止闪烁：</strong>点击托盘图标或点击"停止闪烁"按钮</li>
        <li><strong>控制台调试：</strong>打开开发者工具查看详细日志</li>
      </ul>
    </div>
  </div>

  <script>
    // 检查是否在 Electron 环境中
    function checkElectronAPI() {
      if (!window.electronAPI) {
        showStatus('error', '❌ 错误：未检测到 Electron 环境，请在 Electron 应用中打开此页面');
        return false;
      }
      return true;
    }

    // 显示状态消息
    function showStatus(type, message) {
      const statusEl = document.getElementById('status');
      statusEl.className = `status ${type}`;
      statusEl.textContent = message;
      statusEl.style.display = 'block';
      
      // 3秒后自动隐藏成功消息
      if (type === 'success') {
        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
      }
    }

    // 发送测试通知
    function sendTestNotification() {
      if (!checkElectronAPI()) return;
      
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      
      if (!title || !content) {
        showStatus('error', '❌ 请填写标题和内容');
        return;
      }
      
      try {
        window.electronAPI.testNotification({
          title: title,
          content: content,
          time: new Date().toLocaleTimeString('zh-CN'),
          type: 'test'
        });
        
        showStatus('success', '✅ 测试通知已发送！请查看托盘图标和系统通知');
        console.log('测试通知已发送:', { title, content });
      } catch (error) {
        showStatus('error', `❌ 发送失败: ${error.message}`);
        console.error('发送通知失败:', error);
      }
    }

    // 模拟 MQTT 通知
    function sendMqttNotification() {
      if (!checkElectronAPI()) return;
      
      const title = document.getElementById('title').value.trim() || 'MQTT消息推送';
      const content = document.getElementById('content').value.trim() || '您收到了一条新的MQTT消息';
      
      try {
        window.electronAPI.sendNotification({
          title: title,
          content: content,
          time: new Date().toLocaleTimeString('zh-CN', { 
            hour: '2-digit', 
            minute: '2-digit' 
          }),
          type: 'mqtt',
          messageType: 501,
          data: {
            message: content
          }
        });
        
        showStatus('success', '✅ MQTT 通知已发送！托盘图标正在闪烁');
        console.log('MQTT 通知已发送:', { title, content });
      } catch (error) {
        showStatus('error', `❌ 发送失败: ${error.message}`);
        console.error('发送 MQTT 通知失败:', error);
      }
    }

    // 停止托盘闪烁
    function stopFlash() {
      if (!checkElectronAPI()) return;
      
      try {
        window.electronAPI.stopTrayFlash();
        showStatus('info', 'ℹ️ 已停止托盘图标闪烁');
        console.log('已停止托盘闪烁');
      } catch (error) {
        showStatus('error', `❌ 操作失败: ${error.message}`);
        console.error('停止闪烁失败:', error);
      }
    }

    // 键盘快捷键：Enter 发送通知
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        sendTestNotification();
      }
    });

    // 页面加载完成后检查环境
    window.addEventListener('DOMContentLoaded', () => {
      if (checkElectronAPI()) {
        showStatus('success', '✅ Electron 环境检测成功，可以开始测试');
        console.log('Electron API:', window.electronAPI);
      }
    });
  </script>
</body>
</html>
